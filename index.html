
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SURVIVAL WORLD</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
  background: #111;
}
#hud {
  position: fixed;
  top: 15px;
  left: 15px;
  color: white;
  background: #000a;
  padding: 15px;
  border-radius: 12px;
  z-index: 2;
}
#help {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  background: #000b;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  z-index: 2;
}
#start {
  position: fixed;
  inset: 0;
  background: #101d16;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 5;
}
button {
  padding: 15px 30px;
  font-size: 20px;
  cursor: pointer;
  background: #329b50;
  color: white;
  border: 0;
  border-radius: 10px;
}
</style>
</head>
<body>

<div id="start">
  <h1>🌲 SURVIVAL WORLD</h1>
  <p>عش واستكشف وابنِ منزلك!</p>
  <button id="play">العب الآن</button>
</div>

<div id="hud">
  <b>🌲 SURVIVAL WORLD</b>
  <p>🪵 الخشب: <span id="wood">0</span></p>
  <p>🏠 المنازل: <span id="houses">0</span></p>
</div>

<div id="help">
  WASD للحركة | الماوس للنظر<br>
  اقترب من الخشب لجمعه | B لبناء منزل
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 30, 120);

const camera = new THREE.PerspectiveCamera(
  75, window.innerWidth/window.innerHeight, 0.1, 200
);

camera.position.set(0, 2, 8);

const renderer = new THREE.WebGLRenderer({antialias:false});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x557744, 2));

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(20, 40, 20);
scene.add(sun);

// الأرض
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200,200),
  new THREE.MeshLambertMaterial({color:0x478b42})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = 0;
scene.add(ground);

// اللاعب
const player = new THREE.Object3D();
player.position.set(0,1.7,8);
scene.add(player);
player.add(camera);
camera.position.set(0,0,0);

let yaw = 0;
let pitch = 0;
let wood = 0;
let houses = 0;

const trees = [];
const pickups = [];
const keys = {};

function makeTree(x,z) {
  const tree = new THREE.Group();

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(.25,.35,2,6),
    new THREE.MeshLambertMaterial({color:0x79502a})
  );
  trunk.position.y = 1;
  tree.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(1.5,3.5,7),
    new THREE.MeshLambertMaterial({color:0x176b30})
  );
  leaves.position.y = 3;
  tree.add(leaves);

  tree.position.set(x,0,z);
  scene.add(tree);
  trees.push(tree);

  const log = new THREE.Mesh(
    new THREE.BoxGeometry(.7,.35,.35),
    new THREE.MeshLambertMaterial({color:0x9a642d})
  );
  log.position.set(x+1,0.25,z+1);
  scene.add(log);
  pickups.push(log);
}

for(let i=0;i<35;i++){
  const x = (Math.random()-.5)*90;
  const z = (Math.random()-.5)*90;
  makeTree(x,z);
}

// الحركة
document.addEventListener('keydown',e=>{
  keys[e.code] = true;

  if(e.code === 'KeyB') buildHouse();
});

document.addEventListener('keyup',e=>{
  keys[e.code] = false;
});

document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement === renderer.domElement){
    yaw -= e.movementX * .002;
    pitch -= e.movementY * .002;
    pitch = Math.max(-1.4,Math.min(1.4,pitch));
    player.rotation.y = yaw;
    camera.rotation.x = pitch;
  }
});

document.getElementById('play').onclick=()=>{
  document.getElementById('start').style.display='none';
  renderer.domElement.requestPointerLock();
};

renderer.domElement.addEventListener('click',()=>{
  if(document.getElementById('start').style.display==='none'){
    renderer.domElement.requestPointerLock();
  }
});

// بناء المنزل
function buildHouse(){
  if(wood < 5){
    alert('تحتاج إلى 5 قطع خشب لبناء منزل!');
    return;
  }

  wood -= 5;
  houses++;

  const house = new THREE.Group();

  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(4,3,4),
    new THREE.MeshLambertMaterial({color:0xb47a43})
  );
  wall.position.y=1.5;
  house.add(wall);

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(3.3,2,4),
    new THREE.MeshLambertMaterial({color:0x703b24})
  );
  roof.position.y=4;
  roof.rotation.y=Math.PI/4;
  house.add(roof);

  const door = new THREE.Mesh(
    new THREE.BoxGeometry(1,2,.1),
    new THREE.MeshLambertMaterial({color:0x432516})
  );
  door.position.set(0,1,2.05);
  house.add(door);

  const direction = new THREE.Vector3(0,0,-1);
  direction.applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));

  house.position.set(
    player.position.x + direction.x*7,
    0,
    player.position.z + direction.z*7
  );

  scene.add(house);

  document.getElementById('wood').textContent=wood;
  document.getElementById('houses').textContent=houses;
}

// جمع الخشب والحركة
function animate(){
  requestAnimationFrame(animate);

  const speed = .12;
  const direction = new THREE.Vector3();

  if(keys['KeyW'] || keys['ArrowUp']) direction.z -= 1;
  if(keys['KeyS'] || keys['ArrowDown']) direction.z += 1;
  if(keys['KeyA'] || keys['ArrowLeft']) direction.x -= 1;
  if(keys['KeyD'] || keys['ArrowRight']) direction.x += 1;

  direction.normalize();
  direction.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);

  player.position.x += direction.x*speed;
  player.position.z += direction.z*speed;

  player.position.x = THREE.MathUtils.clamp(player.position.x,-95,95);
  player.position.z = THREE.MathUtils.clamp(player.position.z,-95,95);

  for(let i=pickups.length-1;i>=0;i--){
    if(player.position.distanceTo(pickups[i].position)<2){
      scene.remove(pickups[i]);
      pickups.splice(i,1);
      wood++;
      document.getElementById('wood').textContent=wood;
    }
  }

  renderer.render(scene,camera);
}

animate();

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
